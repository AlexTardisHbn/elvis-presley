<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elvis Presley — Avis &amp; Articles</title>
<meta name="description" content="Avis, critiques et articles personnels sur Elvis Presley.">
<style>
  :root{
    --bg:#0d0b12; --bg-alt:#151019; --bg-card:#1b1521;
    --cream:#f3ead9; --cream-dim:#c9bfae; --gold:#d4af37; --gold-dim:#8c7326;
    --red:#7c2331; --muted:#9b8f9e; --line: rgba(243,234,217,0.14);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--cream); font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    margin:0; padding:32px 20px 80px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  .back-link{display:inline-block; color:var(--cream-dim); text-decoration:none; font-size:0.9rem; margin-bottom:24px;}
  .back-link:hover{color:var(--gold);}
  .cover{width:100%; max-height:500px; object-fit:contain; background:var(--bg-alt); border-radius:10px; margin-bottom:24px;}
  .meta{display:flex; align-items:center; gap:12px; font-family:'JetBrains Mono',monospace,monospace; font-size:0.78rem; margin-bottom:14px;}
  .type-badge{text-transform:uppercase; color:var(--gold); border:1px solid var(--gold-dim); border-radius:20px; padding:2px 10px;}
  .date, .views{color:var(--muted);}
  h1{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.02em; font-size:1.9rem; margin:0 0 20px; color:var(--cream);}
  .content{color:var(--cream-dim); font-size:1.05rem; line-height:1.8; white-space:pre-wrap;}
  #state{color:var(--cream-dim); font-style:italic;}
  #maintenanceOverlay{
    display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);
    align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .like-btn{
    display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);
    border-radius:20px;padding:8px 16px;font-size:0.9rem;color:var(--cream-dim);cursor:pointer;
    margin-top:24px;transition:.2s;
  }
  .like-btn:hover:not(:disabled){border-color:#e7a3c2;color:#e7a3c2;}
  .like-btn.liked{border-color:#e7a3c2;color:#e7a3c2;cursor:default;}
  .like-btn:disabled{opacity:0.85;}
</style>
</head>
<body>
<div id="maintenanceOverlay">
  <div>
    <div class="tag" style="font-family:monospace;font-size:0.75rem;letter-spacing:0.2em;color:var(--red);text-transform:uppercase;">Retour bientôt</div>
    <h1 style="margin:10px 0;">Site en maintenance</h1>
    <p style="color:var(--cream-dim);">Le site est en cours de mise à jour. Repasse un peu plus tard — merci pour ta patience !</p>
  </div>
</div>

<div class="wrap">
  <a href="index.html#avis-articles" class="back-link">← Retour à Avis &amp; Articles</a>
  <div id="state">Chargement...</div>
  <div id="articleBox" style="display:none;">
    <img id="artCover" class="cover" style="display:none;">
    <div class="meta">
      <span class="type-badge" id="artType"></span>
      <span class="date" id="artDate"></span>
      <span class="views" id="artViews"></span>
    </div>
    <h1 id="artTitle"></h1>
    <div class="content" id="artContent"></div>
    <button id="likeBtn" class="like-btn" type="button">🤍 <span id="likeCount">0</span></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  (async function(){
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mode maintenance : masque le site aux visiteurs non connectés
    try{
      const [{ data: settings }, { data: sessionData }] = await Promise.all([
        client.from('site_settings').select('maintenance').eq('id', 'global').single(),
        client.auth.getSession()
      ]);
      const isAdmin = !!(sessionData && sessionData.session);
      if (settings && settings.maintenance && !isAdmin){
        document.getElementById('maintenanceOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        return;
      }
    }catch(e){
      console.warn('Vérification du mode maintenance impossible :', e);
    }

    client.from('page_views').insert({ path: location.pathname }).then(({ error }) => {
      if (error) console.warn('Comptage de visite impossible :', error);
    });
    const state = document.getElementById('state');
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id){
      state.textContent = "Article introuvable.";
      return;
    }

    const { data: post, error } = await client
      .from('posts')
      .select('*')
      .eq('id', id)
      .eq('published', true)
      .single();

    if (error || !post){
      state.textContent = "Cet article est introuvable ou n'est plus disponible.";
      return;
    }

    const typeLabels = { avis: 'Avis', critique: 'Critique', article: 'Article' };
    document.title = post.title + ' — Elvis Presley';
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc){
      metaDesc.setAttribute('content', post.content.slice(0, 155).trim() + (post.content.length > 155 ? '…' : ''));
    }
    document.getElementById('artType').textContent = typeLabels[post.type] || post.type;
    document.getElementById('artDate').textContent = new Date(post.created_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
    document.getElementById('artViews').textContent = `${(post.views || 0) + 1} vues`;
    document.getElementById('artTitle').textContent = post.title;

    // Marque cette publication comme lue (pour le badge de notification de l'accueil)
    try{
      const readIds = JSON.parse(localStorage.getItem('readPosts') || '[]');
      if (!readIds.includes(post.id)){
        readIds.push(post.id);
        localStorage.setItem('readPosts', JSON.stringify(readIds));
      }
    }catch(e){}
    document.getElementById('artContent').textContent = post.content;

    // Bouton J'aime
    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');
    likeCount.textContent = post.likes || 0;
    let likedIds = [];
    try{ likedIds = JSON.parse(localStorage.getItem('likedPosts') || '[]'); }catch(e){}
    if (likedIds.includes(post.id)){
      likeBtn.classList.add('liked');
      likeBtn.disabled = true;
      likeBtn.innerHTML = `❤️ <span id="likeCount">${post.likes || 0}</span>`;
    }
    likeBtn.addEventListener('click', async () => {
      likeBtn.disabled = true;
      const { error } = await client.rpc('increment_like_count', { post_id: post.id });
      if (!error){
        likeBtn.classList.add('liked');
        likeBtn.innerHTML = `❤️ <span id="likeCount">${(post.likes || 0) + 1}</span>`;
        likedIds.push(post.id);
        localStorage.setItem('likedPosts', JSON.stringify(likedIds));
      } else {
        likeBtn.disabled = false;
      }
    });
    if (post.cover_url){
      const img = document.getElementById('artCover');
      img.src = post.cover_url;
      img.style.display = 'block';
    }
    state.style.display = 'none';
    document.getElementById('articleBox').style.display = 'block';

    // Données structurées (SEO) propres à cet article
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": post.title,
      "datePublished": post.created_at,
      "author": { "@type": "Person", "name": "Alexandre" },
      "about": { "@type": "Person", "name": "Elvis Presley" },
      ...(post.cover_url ? { "image": post.cover_url } : {})
    });
    document.head.appendChild(ld);

    // Incrémente le compteur de vues (fonction sécurisée côté serveur)
    client.rpc('increment_view_count', { post_id: id }).then(({ error }) => {
      if (error) console.warn('Compteur de vues non incrémenté :', error);
    });
  })();
</script>

</body>
</html>
