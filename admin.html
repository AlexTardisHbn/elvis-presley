<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Elvis Presley</title>
<style>
  :root{
    --bg:#0d0b12; --bg-alt:#151019; --bg-card:#1b1521;
    --cream:#f3ead9; --cream-dim:#c9bfae; --gold:#d4af37; --gold-dim:#8c7326;
    --red:#7c2331; --line: rgba(243,234,217,0.14);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--cream); font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh; margin:0; padding:24px;
  }

  /* ---- écran de connexion ---- */
  #loginScreen{
    min-height:80vh; display:flex; align-items:center; justify-content:center;
  }
  .box{
    width:100%; max-width:420px; background:var(--bg-card); border:1px solid var(--line);
    border-radius:10px; padding:32px 30px;
  }
  .box h1{font-size:1.3rem; margin:0 0 6px; color:var(--gold);}
  .box p.sub{color:var(--cream-dim); font-size:0.9rem; margin:0 0 24px;}

  /* ---- éléments de formulaire communs ---- */
  label{display:block; font-size:0.85rem; color:var(--cream-dim); margin:14px 0 6px;}
  input, textarea, select{
    width:100%; background:var(--bg-alt); border:1px solid var(--line); border-radius:6px;
    color:var(--cream); padding:10px 12px; font-size:0.95rem; font-family:inherit;
  }
  textarea{min-height:220px; resize:vertical; line-height:1.5;}
  button{
    margin-top:18px; background:var(--gold); color:#1a0f14; border:none;
    border-radius:6px; padding:11px 18px; font-weight:700; font-size:0.9rem; cursor:pointer;
  }
  button:hover{background:var(--gold-dim); color:var(--cream);}
  button.secondary{background:transparent; border:1px solid var(--line); color:var(--cream-dim);}
  button.danger{background:transparent; border:1px solid var(--red); color:#e79aa6;}
  button.danger:hover{background:var(--red); color:var(--cream);}
  #status{margin-top:14px; font-size:0.88rem; min-height:1.2em;}
  #status.ok{color:#8fce9a;}
  #status.err{color:var(--red);}

  /* ---- tableau de bord ---- */
  #dashboard{display:none; max-width:820px; margin:0 auto;}
  .dash-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;
    padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .dash-header h1{font-size:1.25rem; margin:0; color:var(--gold);}
  .dash-header .who{font-size:0.82rem; color:var(--cream-dim);}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .toolbar h2{font-size:1rem; margin:0; color:var(--cream);}

  .list-filters{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .list-filters input{flex:1; min-width:160px;}
  .list-filters select{width:auto; min-width:130px;}

  .post-row{
    background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; gap:14px;
  }
  .post-row .info{flex:1; min-width:0;}
  .post-row .type-badge{
    display:inline-block; font-size:0.68rem; text-transform:uppercase; color:var(--gold);
    border:1px solid var(--gold-dim); border-radius:20px; padding:2px 9px; margin-bottom:6px;
  }
  .post-row .title{font-weight:600; color:var(--cream); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .post-row .date{font-size:0.78rem; color:var(--cream-dim);}
  .post-row .actions{display:flex; gap:8px; flex-shrink:0;}
  .post-row .actions button{margin-top:0; padding:8px 12px; font-size:0.82rem;}
  #emptyMsg{color:var(--cream-dim); font-style:italic;}

  /* ---- spinner de chargement ---- */
  .spinner{
    display:inline-block; width:14px; height:14px; margin-right:6px;
    border:2px solid rgba(26,15,20,0.35); border-top-color:#1a0f14; border-radius:50%;
    animation:spin 0.7s linear infinite; vertical-align:-2px;
  }
  button.secondary .spinner{border:2px solid rgba(243,234,217,0.3); border-top-color:var(--cream);}
  @keyframes spin{to{transform:rotate(360deg);}}
  button[disabled]{opacity:0.6; cursor:not-allowed;}
  .field-error{color:var(--red); font-size:0.8rem; margin-top:6px;}

  /* ---- formulaire (création / édition) ---- */
  #postForm{
    display:none; background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding:22px 24px; margin-bottom:24px;
  }
  #postForm h2{font-size:1rem; margin:0 0 4px; color:var(--gold);}
  .form-actions{display:flex; gap:10px; flex-wrap:wrap;}

  /* ---- galerie admin ---- */
  #photoForm{
    display:none; background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding:22px 24px; margin-bottom:20px;
  }
  #photoForm h2{font-size:1rem; margin:0 0 4px; color:var(--gold);}
  .gallery-admin-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px;}
  .gallery-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .gallery-item img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block;}
  .gallery-item .cap{font-size:0.75rem; color:var(--cream-dim); padding:8px 10px 0; flex:1;}
  .gallery-item button{
    margin:8px 10px 10px; padding:6px 10px; font-size:0.75rem;
  }

  /* ---- modale d'aperçu ---- */
  #previewOverlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
    z-index:100; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;
  }
  #previewOverlay.open{display:flex;}
  .preview-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    max-width:600px; width:100%; padding:0; overflow:hidden;
  }
  .preview-card img{width:100%; display:block; max-height:280px; object-fit:cover;}
  .preview-card .preview-body{padding:22px 24px;}
  .preview-card .type-badge{
    display:inline-block; font-size:0.68rem; text-transform:uppercase; color:var(--gold);
    border:1px solid var(--gold-dim); border-radius:20px; padding:2px 9px; margin-bottom:10px;
  }
  .preview-card h3{margin:0 0 14px; color:var(--cream); font-size:1.3rem;}
  .preview-card .preview-content{color:var(--cream-dim); white-space:pre-wrap; line-height:1.6;}
  .preview-close{margin-top:20px;}

  /* ---- mobile ---- */
  @media(max-width:640px){
    body{padding:14px;}
    .dash-header{flex-direction:column; align-items:stretch; gap:10px;}
    .dash-header .who{display:block; width:100%; font-size:0.78rem; word-break:break-all;}
    .dash-header > div{display:flex; flex-direction:column; gap:8px; width:100%;}
    .dash-header a, .dash-header button{margin-left:0 !important; width:100%; text-align:center;}
    .toolbar{flex-direction:column; align-items:stretch;}
    .toolbar button{width:100%;}
    .post-row{flex-direction:column; align-items:stretch;}
    .post-row .actions{width:100%;}
    .post-row .actions button{flex:1;}
    .list-filters{flex-direction:column;}
    .list-filters select{width:100%;}
    .gallery-admin-list{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="loginScreen">
  <div class="box">
    <h1>Espace admin</h1>
    <p class="sub">Réservé à l'auteur du site.</p>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" autocomplete="current-password">
    <button id="loginBtn">Se connecter</button>
    <div id="status"></div>
    <p style="margin-top:14px;text-align:center;">
      <a href="#" id="forgotLink" style="color:var(--cream-dim);font-size:0.82rem;">Mot de passe oublié ?</a>
    </p>
    <p style="margin-top:10px;text-align:center;">
      <a href="index.html" style="color:var(--cream-dim);font-size:0.82rem;">← Retour au site</a>
    </p>
  </div>
</div>

<!-- TABLEAU DE BORD -->
<div id="dashboard">
  <div class="dash-header">
    <h1>Mes avis &amp; articles</h1>
    <div>
      <span class="who" id="whoami"></span>
      <a href="index.html" class="secondary" style="display:inline-block; margin-top:0; margin-left:10px; padding:11px 18px; border-radius:6px; text-decoration:none; font-size:0.9rem; font-weight:700;">← Retour au site</a>
      <button id="logoutBtn" class="secondary" style="margin-top:0; margin-left:10px;">Se déconnecter</button>
    </div>
  </div>

  <!-- Formulaire de création / édition -->
  <div id="postForm">
    <h2 id="formTitle">Nouvelle publication</h2>
    <label for="fType">Type</label>
    <select id="fType">
      <option value="avis">Avis</option>
      <option value="critique">Critique</option>
      <option value="article">Article</option>
    </select>
    <label for="fTitle">Titre</label>
    <input type="text" id="fTitle" placeholder="Titre de la publication">
    <label for="fContent">Contenu</label>
    <textarea id="fContent" placeholder="Écris ton texte ici..."></textarea>
    <label for="fCoverFile">Image de couverture (optionnelle)</label>
    <input type="file" id="fCoverFile" accept="image/*">
    <div id="coverError" class="field-error"></div>
    <img id="fCoverPreview" style="display:none;max-width:100%;border-radius:6px;margin-top:10px;">
    <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
      <input type="checkbox" id="fPublished" style="width:auto;" checked>
      <span style="margin:0;">Publié (visible par les visiteurs)</span>
    </label>
    <div class="form-actions">
      <button id="saveBtn">Enregistrer</button>
      <button id="previewBtn" class="secondary" type="button">👁 Aperçu</button>
      <button id="cancelBtn" class="secondary">Annuler</button>
    </div>
    <div id="statusForm"></div>
  </div>

  <div class="toolbar">
    <h2>Publications</h2>
    <button id="newPostBtn">+ Nouvelle publication</button>
  </div>
  <div class="list-filters">
    <input type="text" id="searchInput" placeholder="Rechercher par titre...">
    <select id="filterType">
      <option value="">Tous les types</option>
      <option value="avis">Avis</option>
      <option value="critique">Critique</option>
      <option value="article">Article</option>
    </select>
  </div>
  <div id="postsList"></div>

  <div class="toolbar" style="margin-top:40px;">
    <h2>Galerie</h2>
    <button id="newPhotoBtn">+ Ajouter une photo</button>
  </div>

  <!-- Formulaire d'ajout de photo -->
  <div id="photoForm">
    <h2>Nouvelle photo</h2>
    <label for="fPhotoFile">Image</label>
    <input type="file" id="fPhotoFile" accept="image/*">
    <div id="photoError" class="field-error"></div>
    <img id="fPhotoPreview" style="display:none;max-width:100%;border-radius:6px;margin-top:10px;">
    <label for="fPhotoCaption">Légende (optionnelle)</label>
    <input type="text" id="fPhotoCaption" placeholder="Ex : Devant Graceland, été 1972">
    <div class="form-actions">
      <button id="savePhotoBtn">Enregistrer</button>
      <button id="cancelPhotoBtn" class="secondary" type="button">Annuler</button>
    </div>
    <div id="statusPhoto"></div>
  </div>

  <div id="galleryList" class="gallery-admin-list"></div>
</div>

<!-- MODALE D'APERÇU -->
<div id="previewOverlay">
  <div class="preview-card">
    <img id="previewImg" style="display:none;">
    <div class="preview-body">
      <span class="type-badge" id="previewType"></span>
      <h3 id="previewTitle"></h3>
      <div class="preview-content" id="previewContent"></div>
      <button id="previewCloseBtn" class="secondary preview-close">Fermer l'aperçu</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const status = document.getElementById('status');
  const postsList = document.getElementById('postsList');
  const postForm = document.getElementById('postForm');
  const formTitle = document.getElementById('formTitle');
  const statusForm = document.getElementById('statusForm');
  const fCoverFile = document.getElementById('fCoverFile');
  const fCoverPreview = document.getElementById('fCoverPreview');
  const coverError = document.getElementById('coverError');
  const searchInput = document.getElementById('searchInput');
  const filterType = document.getElementById('filterType');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  const MAX_IMAGE_SIZE = 5 * 1024 * 1024; // 5 Mo

  let editingId = null;      // null = création, sinon id du post en cours d'édition
  let currentCoverUrl = null; // image déjà enregistrée sur le post en cours d'édition
  let allPosts = [];          // dernière liste chargée depuis Supabase
  let formDirty = false;      // le formulaire a des changements non enregistrés

  function showDashboard(session){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    document.getElementById('whoami').textContent = session.user.email;
    refreshPosts();
    refreshGallery();
  }

  // Session déjà active ?
  client.auth.getSession().then(({ data }) => {
    if (data.session) showDashboard(data.session);
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    status.textContent = 'Connexion...';
    status.className = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error){
      console.error('Erreur de connexion Supabase :', error);
      status.textContent = 'Erreur : ' + error.message;
      status.className = 'err';
    } else {
      status.textContent = '';
      showDashboard(data.session);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (postForm.style.display === 'block' && formDirty && !confirm('Tu as des modifications non enregistrées. Te déconnecter quand même ?')) return;
    await client.auth.signOut();
    dashboard.style.display = 'none';
    loginScreen.style.display = 'flex';
    status.textContent = '';
  });

  // ---- Mot de passe oublié ----
  document.getElementById('forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = prompt('Entre ton e-mail pour recevoir un lien de réinitialisation :');
    if (!email) return;
    const redirectTo = location.href.replace(/admin\.html.*$/, 'reset.html');
    const { error } = await client.auth.resetPasswordForEmail(email.trim(), { redirectTo });
    if (error){
      status.textContent = 'Erreur : ' + error.message;
      status.className = 'err';
    } else {
      status.textContent = 'E-mail envoyé, si ce compte existe.';
      status.className = 'ok';
    }
  });

  // ---- Aperçu de l'image de couverture ----
  fCoverFile.addEventListener('change', () => {
    const file = fCoverFile.files[0];
    coverError.textContent = '';
    if (!file) return;
    if (file.size > MAX_IMAGE_SIZE){
      coverError.textContent = `Image trop lourde (${(file.size/1024/1024).toFixed(1)} Mo) — la limite est de 5 Mo. Choisis une image plus légère.`;
      fCoverFile.value = '';
      return;
    }
    formDirty = true;
    fCoverPreview.src = URL.createObjectURL(file);
    fCoverPreview.style.display = 'block';
  });

  // ---- Liste des publications ----
  async function refreshPosts(){
    postsList.innerHTML = '<p id="emptyMsg">Chargement...</p>';
    const { data, error } = await client
      .from('posts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error){
      postsList.innerHTML = '<p id="emptyMsg">Erreur de chargement.</p>';
      return;
    }
    allPosts = data || [];
    renderPosts();
  }

  function renderPosts(){
    const query = searchInput.value.trim().toLowerCase();
    const type = filterType.value;
    const filtered = allPosts.filter(post => {
      const matchesQuery = !query || post.title.toLowerCase().includes(query);
      const matchesType = !type || post.type === type;
      return matchesQuery && matchesType;
    });

    if (filtered.length === 0){
      postsList.innerHTML = allPosts.length === 0
        ? '<p id="emptyMsg">Aucune publication pour le moment.</p>'
        : '<p id="emptyMsg">Aucune publication ne correspond à ta recherche.</p>';
      return;
    }

    const typeLabels = { avis: 'Avis', critique: 'Critique', article: 'Article' };
    postsList.innerHTML = '';
    filtered.forEach(post => {
      const row = document.createElement('div');
      row.className = 'post-row';
      const date = new Date(post.created_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
      const draftBadge = post.published ? '' : ' · <span style="color:var(--red);">Brouillon</span>';
      row.innerHTML = `
        <div class="info">
          <span class="type-badge">${typeLabels[post.type] || post.type}</span>
          <div class="title">${escapeHtml(post.title)}</div>
          <div class="date">${date} · ${post.views || 0} vues${draftBadge}</div>
        </div>
        <div class="actions">
          <button class="secondary editBtn" style="margin-top:0;">Modifier</button>
          <button class="danger deleteBtn" style="margin-top:0;">Supprimer</button>
        </div>`;
      row.querySelector('.editBtn').addEventListener('click', () => tryOpenForm(post));
      row.querySelector('.deleteBtn').addEventListener('click', () => deletePost(post.id, post.title));
      postsList.appendChild(row);
    });
  }

  searchInput.addEventListener('input', renderPosts);
  filterType.addEventListener('change', renderPosts);

  // ---- Formulaire création / édition ----
  document.getElementById('newPostBtn').addEventListener('click', () => tryOpenForm(null));
  cancelBtn.addEventListener('click', () => {
    if (formDirty && !confirm('Tu as des modifications non enregistrées. Les abandonner ?')) return;
    closeForm();
  });

  function tryOpenForm(post){
    if (postForm.style.display === 'block' && formDirty){
      if (!confirm('Tu as des modifications non enregistrées. Les abandonner ?')) return;
    }
    openForm(post);
  }

  // Marque le formulaire comme modifié dès qu'on touche à un champ
  ['fType','fTitle','fContent','fPublished'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { formDirty = true; });
    document.getElementById(id).addEventListener('change', () => { formDirty = true; });
  });

  // Avertit avant de fermer/recharger l'onglet si des changements ne sont pas enregistrés
  window.addEventListener('beforeunload', (e) => {
    if (postForm.style.display === 'block' && formDirty){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function openForm(post){
    editingId = post ? post.id : null;
    currentCoverUrl = post ? (post.cover_url || null) : null;
    formTitle.textContent = post ? 'Modifier la publication' : 'Nouvelle publication';
    document.getElementById('fType').value = post ? post.type : 'avis';
    document.getElementById('fTitle').value = post ? post.title : '';
    document.getElementById('fContent').value = post ? post.content : '';
    document.getElementById('fPublished').checked = post ? !!post.published : true;
    fCoverFile.value = '';
    coverError.textContent = '';
    if (currentCoverUrl){
      fCoverPreview.src = currentCoverUrl;
      fCoverPreview.style.display = 'block';
    } else {
      fCoverPreview.style.display = 'none';
    }
    statusForm.textContent = '';
    formDirty = false;
    postForm.style.display = 'block';
    postForm.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function closeForm(){
    postForm.style.display = 'none';
    editingId = null;
    currentCoverUrl = null;
    formDirty = false;
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const type = document.getElementById('fType').value;
    const title = document.getElementById('fTitle').value.trim();
    const content = document.getElementById('fContent').value.trim();
    const published = document.getElementById('fPublished').checked;

    if (!title || !content){
      statusForm.textContent = 'Titre et contenu sont obligatoires.';
      statusForm.className = 'err';
      return;
    }

    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span>Enregistrement...';
    statusForm.textContent = '';
    statusForm.className = '';

    // Upload de l'image de couverture si un nouveau fichier a été choisi
    let coverUrl = currentCoverUrl;
    const file = fCoverFile.files[0];
    if (file){
      const ext = file.name.split('.').pop();
      const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: uploadError } = await client.storage.from('post-images').upload(path, file);
      if (uploadError){
        statusForm.textContent = "Erreur d'upload de l'image : " + uploadError.message;
        statusForm.className = 'err';
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.textContent = 'Enregistrer';
        return;
      }
      const { data: publicUrlData } = client.storage.from('post-images').getPublicUrl(path);
      coverUrl = publicUrlData.publicUrl;
    }

    const payload = { type, title, content, published, cover_url: coverUrl };

    let error, insertedRow;
    const isNewPost = !editingId;
    if (editingId){
      ({ error } = await client.from('posts').update(payload).eq('id', editingId));
    } else {
      ({ data: insertedRow, error } = await client.from('posts').insert(payload).select().single());
    }

    saveBtn.disabled = false;
    cancelBtn.disabled = false;
    saveBtn.textContent = 'Enregistrer';

    if (error){
      statusForm.textContent = "Erreur : impossible d'enregistrer.";
      statusForm.className = 'err';
    } else {
      statusForm.textContent = 'Enregistré ✓';
      statusForm.className = 'ok';
      closeForm();
      refreshPosts();

      // Notifie Discord uniquement pour une nouvelle publication, publiée
      if (isNewPost && published && insertedRow){
        client.functions.invoke('notify-discord', {
          body: { title, type, id: insertedRow.id, content, coverUrl }
        }).catch(e => console.warn('Notification Discord impossible :', e));
      }
    }
  });

  // ---- Aperçu avant publication ----
  const previewOverlay = document.getElementById('previewOverlay');
  document.getElementById('previewBtn').addEventListener('click', () => {
    const type = document.getElementById('fType').value;
    const typeLabels = { avis: 'Avis', critique: 'Critique', article: 'Article' };
    const title = document.getElementById('fTitle').value.trim() || '(sans titre)';
    const content = document.getElementById('fContent').value.trim() || '(sans contenu)';
    const file = fCoverFile.files[0];
    const imgSrc = file ? URL.createObjectURL(file) : currentCoverUrl;

    document.getElementById('previewType').textContent = typeLabels[type] || type;
    document.getElementById('previewTitle').textContent = title;
    document.getElementById('previewContent').textContent = content;
    const previewImg = document.getElementById('previewImg');
    if (imgSrc){
      previewImg.src = imgSrc;
      previewImg.style.display = 'block';
    } else {
      previewImg.style.display = 'none';
    }
    previewOverlay.classList.add('open');
  });
  document.getElementById('previewCloseBtn').addEventListener('click', () => {
    previewOverlay.classList.remove('open');
  });
  previewOverlay.addEventListener('click', (e) => {
    if (e.target === previewOverlay) previewOverlay.classList.remove('open');
  });

  async function deletePost(id, title){
    if (!confirm(`Supprimer définitivement « ${title} » ?`)) return;
    const { error } = await client.from('posts').delete().eq('id', id);
    if (!error) refreshPosts();
  }

  // ---- Galerie ----
  const photoForm = document.getElementById('photoForm');
  const fPhotoFile = document.getElementById('fPhotoFile');
  const fPhotoPreview = document.getElementById('fPhotoPreview');
  const fPhotoCaption = document.getElementById('fPhotoCaption');
  const photoError = document.getElementById('photoError');
  const statusPhoto = document.getElementById('statusPhoto');
  const savePhotoBtn = document.getElementById('savePhotoBtn');
  const galleryList = document.getElementById('galleryList');

  document.getElementById('newPhotoBtn').addEventListener('click', () => {
    fPhotoFile.value = '';
    fPhotoCaption.value = '';
    fPhotoPreview.style.display = 'none';
    photoError.textContent = '';
    statusPhoto.textContent = '';
    photoForm.style.display = 'block';
    photoForm.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  document.getElementById('cancelPhotoBtn').addEventListener('click', () => {
    photoForm.style.display = 'none';
  });

  fPhotoFile.addEventListener('change', () => {
    const file = fPhotoFile.files[0];
    photoError.textContent = '';
    if (!file) return;
    if (file.size > MAX_IMAGE_SIZE){
      photoError.textContent = `Image trop lourde (${(file.size/1024/1024).toFixed(1)} Mo) — la limite est de 5 Mo.`;
      fPhotoFile.value = '';
      return;
    }
    fPhotoPreview.src = URL.createObjectURL(file);
    fPhotoPreview.style.display = 'block';
  });

  savePhotoBtn.addEventListener('click', async () => {
    const file = fPhotoFile.files[0];
    if (!file){
      statusPhoto.textContent = 'Choisis une image.';
      statusPhoto.className = 'err';
      return;
    }
    savePhotoBtn.disabled = true;
    savePhotoBtn.innerHTML = '<span class="spinner"></span>Enregistrement...';
    statusPhoto.textContent = '';
    statusPhoto.className = '';

    const ext = file.name.split('.').pop();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: uploadError } = await client.storage.from('gallery-images').upload(path, file);

    savePhotoBtn.disabled = false;
    savePhotoBtn.textContent = 'Enregistrer';

    if (uploadError){
      statusPhoto.textContent = "Erreur d'upload : " + uploadError.message;
      statusPhoto.className = 'err';
      return;
    }
    const { data: publicUrlData } = client.storage.from('gallery-images').getPublicUrl(path);

    const { error } = await client.from('gallery_images').insert({
      image_url: publicUrlData.publicUrl,
      caption: fPhotoCaption.value.trim() || null,
    });

    if (error){
      statusPhoto.textContent = "Erreur : impossible d'enregistrer.";
      statusPhoto.className = 'err';
    } else {
      statusPhoto.textContent = 'Enregistré ✓';
      statusPhoto.className = 'ok';
      photoForm.style.display = 'none';
      refreshGallery();
    }
  });

  async function refreshGallery(){
    galleryList.innerHTML = '<p id="emptyMsg">Chargement...</p>';
    const { data, error } = await client
      .from('gallery_images')
      .select('*')
      .order('created_at', { ascending: false });

    if (error){
      galleryList.innerHTML = '<p id="emptyMsg">Erreur de chargement.</p>';
      return;
    }
    if (!data || data.length === 0){
      galleryList.innerHTML = '<p id="emptyMsg">Aucune photo pour le moment.</p>';
      return;
    }
    galleryList.innerHTML = '';
    data.forEach(photo => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `
        <img src="${escapeHtml(photo.image_url)}" alt="${escapeHtml(photo.caption || '')}">
        <div class="cap">${escapeHtml(photo.caption || '(sans légende)')}</div>
        <button class="danger deletePhotoBtn">Supprimer</button>
      `;
      item.querySelector('.deletePhotoBtn').addEventListener('click', () => deletePhoto(photo.id));
      galleryList.appendChild(item);
    });
  }

  async function deletePhoto(id){
    if (!confirm('Supprimer définitivement cette photo ?')) return;
    const { error } = await client.from('gallery_images').delete().eq('id', id);
    if (!error) refreshGallery();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
</script>


</body>
</html>
