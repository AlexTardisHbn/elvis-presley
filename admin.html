<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Elvis Presley</title>
<style>
  :root{
    --bg:#0d0b12; --bg-alt:#151019; --bg-card:#1b1521;
    --cream:#f3ead9; --cream-dim:#c9bfae; --gold:#d4af37; --gold-dim:#8c7326;
    --red:#7c2331; --line: rgba(243,234,217,0.14);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--cream); font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0; padding:24px;
  }
  .box{
    width:100%; max-width:460px; background:var(--bg-card); border:1px solid var(--line);
    border-radius:10px; padding:32px 30px;
  }
  h1{font-size:1.3rem; margin:0 0 6px; color:var(--gold);}
  p.sub{color:var(--cream-dim); font-size:0.9rem; margin:0 0 24px;}
  label{display:block; font-size:0.85rem; color:var(--cream-dim); margin:14px 0 6px;}
  input, textarea{
    width:100%; background:var(--bg-alt); border:1px solid var(--line); border-radius:6px;
    color:var(--cream); padding:10px 12px; font-size:0.95rem; font-family:inherit;
  }
  textarea{min-height:180px; resize:vertical; line-height:1.5;}
  button{
    margin-top:18px; width:100%; background:var(--gold); color:#1a0f14; border:none;
    border-radius:6px; padding:12px; font-weight:700; font-size:0.95rem; cursor:pointer;
  }
  button:hover{background:var(--gold-dim); color:var(--cream);}
  button.secondary{
    background:transparent; border:1px solid var(--line); color:var(--cream-dim); margin-top:10px;
  }
  #status{margin-top:14px; font-size:0.88rem; min-height:1.2em;}
  #status.ok{color:#8fce9a;}
  #status.err{color:var(--red);}
  #editArea{display:none;}
</style>
</head>
<body>

<div class="box">
  <h1>Espace admin</h1>
  <p class="sub">Réservé à l'auteur du site.</p>

  <!-- Formulaire de connexion -->
  <div id="loginArea">
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" autocomplete="current-password">
    <button id="loginBtn">Se connecter</button>
    <div id="status"></div>
  </div>

  <!-- Formulaire d'édition (affiché une fois connecté) -->
  <div id="editArea">
    <label for="content">Texte « Mon avis personnel »</label>
    <textarea id="content"></textarea>
    <button id="saveBtn">Enregistrer</button>
    <button id="logoutBtn" class="secondary">Se déconnecter</button>
    <div id="statusEdit"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginArea = document.getElementById('loginArea');
  const editArea = document.getElementById('editArea');
  const status = document.getElementById('status');
  const statusEdit = document.getElementById('statusEdit');
  const contentBox = document.getElementById('content');

  function showEditor(){
    loginArea.style.display = 'none';
    editArea.style.display = 'block';
    loadContent();
  }

  async function loadContent(){
    const { data, error } = await client
      .from('site_content')
      .select('content')
      .eq('id', 'avis_personnel')
      .single();
    if (!error && data){
      contentBox.value = data.content;
    }
  }

  // Si déjà connecté (session existante), passer directement à l'éditeur
  client.auth.getSession().then(({ data }) => {
    if (data.session) showEditor();
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    status.textContent = 'Connexion...';
    status.className = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error){
      status.textContent = 'Identifiants incorrects.';
      status.className = 'err';
    } else {
      status.textContent = '';
      showEditor();
    }
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    statusEdit.textContent = 'Enregistrement...';
    statusEdit.className = '';
    const { error } = await client
      .from('site_content')
      .update({ content: contentBox.value })
      .eq('id', 'avis_personnel');
    if (error){
      statusEdit.textContent = "Erreur : impossible d'enregistrer.";
      statusEdit.className = 'err';
    } else {
      statusEdit.textContent = 'Enregistré ✓';
      statusEdit.className = 'ok';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    editArea.style.display = 'none';
    loginArea.style.display = 'block';
    status.textContent = '';
  });
</script>

</body>
</html>
