<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory — Elvis Presley</title>
<meta name="description" content="Un petit jeu de memory avec les photos d'Elvis Presley.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0d0b12; --bg-alt:#151019; --bg-card:#1b1521;
    --cream:#f3ead9; --cream-dim:#c9bfae; --gold:#d4af37; --gold-dim:#8c7326;
    --pink:#e7a3c2; --line: rgba(243,234,217,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Space Mono',monospace;
    min-height:100vh; padding:24px 16px 60px; display:flex; flex-direction:column; align-items:center;
  }
  h1{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:.02em; font-weight:400; font-size:2rem; color:var(--gold); margin-bottom:6px; text-align:center;}
  p.sub{color:var(--cream-dim); margin-bottom:20px; text-align:center; max-width:420px;}
  .back-link{color:var(--cream-dim); text-decoration:none; font-size:0.85rem; margin-bottom:20px; display:inline-block;}
  .back-link:hover{color:var(--gold);}
  .hud{display:flex; gap:24px; margin-bottom:20px; font-size:0.85rem;}
  .hud b{color:var(--gold);}
  .board{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
    width:100%; max-width:480px;
  }
  .card{
    aspect-ratio:1/1; perspective:600px; cursor:pointer;
  }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .4s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:8px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card-back{
    background:linear-gradient(160deg, var(--bg-card), var(--bg-alt));
    border:1px solid var(--line); font-family:'Anton',sans-serif; color:var(--gold); font-size:1.4rem;
  }
  .card-front{
    transform:rotateY(180deg); border:1px solid var(--gold-dim);
  }
  .card-front img{width:100%; height:100%; object-fit:cover; display:block;}
  .card.matched .card-front{border-color:var(--pink); box-shadow:0 0 14px rgba(231,163,194,0.5);}
  #winMsg{
    margin-top:24px; text-align:center; color:var(--pink); font-size:1.05rem; display:none;
  }
  #restartBtn{
    margin-top:16px; background:var(--gold); color:#1a0f14; border:none; border-radius:20px;
    padding:10px 22px; font-weight:700; font-family:inherit; cursor:pointer; display:none;
  }
  #restartBtn:hover{background:var(--gold-dim); color:var(--cream);}
</style>
</head>
<body>

<a href="galerie.html" class="back-link">← Retour à la galerie</a>
<h1>Memory Elvis</h1>
<p class="sub">Retrouve les 8 paires de photos en un minimum de coups.</p>

<div class="hud">
  <span>Coups : <b id="moveCount">0</b></span>
  <span>Paires : <b id="matchCount">0</b>/8</span>
</div>

<div class="board" id="board"></div>

<p id="winMsg">🎉 Bravo, terminé en <span id="finalMoves"></span> coups !</p>
<button id="restartBtn">Rejouer</button>

<script>
  const IMAGES = [
    'images/img-057.webp', 'images/img-058.webp', 'images/img-059.webp', 'images/img-060.webp',
    'images/img-061.webp', 'images/img-062.webp', 'images/img-063.webp', 'images/img-064.webp'
  ];

  const board = document.getElementById('board');
  const moveCountEl = document.getElementById('moveCount');
  const matchCountEl = document.getElementById('matchCount');
  const winMsg = document.getElementById('winMsg');
  const finalMoves = document.getElementById('finalMoves');
  const restartBtn = document.getElementById('restartBtn');

  let flipped = [];
  let matched = 0;
  let moves = 0;
  let lock = false;

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildBoard(){
    board.innerHTML = '';
    flipped = [];
    matched = 0;
    moves = 0;
    lock = false;
    moveCountEl.textContent = '0';
    matchCountEl.textContent = '0';
    winMsg.style.display = 'none';
    restartBtn.style.display = 'none';

    const deck = shuffle([...IMAGES, ...IMAGES]);
    deck.forEach((src, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.src = src;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">♫</div>
          <div class="card-face card-front"><img src="${src}" alt="" loading="lazy"></div>
        </div>`;
      card.addEventListener('click', () => onCardClick(card));
      board.appendChild(card);
    });
  }

  function onCardClick(card){
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2){
      moves++;
      moveCountEl.textContent = moves;
      lock = true;
      const [a, b] = flipped;
      if (a.dataset.src === b.dataset.src){
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        matchCountEl.textContent = matched;
        flipped = [];
        lock = false;
        if (matched === IMAGES.length){
          finalMoves.textContent = moves;
          winMsg.style.display = 'block';
          restartBtn.style.display = 'inline-block';
        }
      } else {
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          lock = false;
        }, 800);
      }
    }
  }

  restartBtn.addEventListener('click', buildBoard);
  buildBoard();

  // Comptage de visite (statistiques admin)
  (function(){
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = () => {
      const c = document.createElement('script');
      c.src = 'supabase-config.js';
      c.onload = () => {
        try{
          const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          client.from('page_views').insert({ path: location.pathname });
        }catch(e){}
      };
      document.body.appendChild(c);
    };
    document.body.appendChild(s);
  })();
</script>

</body>
</html>
