<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Elvis Presley</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0d0b12; --bg-alt:#151019; --bg-card:#1b1521;
    --cream:#f3ead9; --cream-dim:#c9bfae; --gold:#d4af37; --gold-dim:#8c7326;
    --pink:#e7a3c2; --red:#7c2331; --muted:#9b8f9e;
    --line: rgba(243,234,217,0.14);
  }
  html[data-theme="light"]{
    --bg:#f7f1e3; --bg-alt:#efe3cb; --bg-card:#fffbf1;
    --cream:#241a12; --cream-dim:#5a4c3c; --gold:#a8710f; --gold-dim:#c99a3a;
    --pink:#a8456c; --red:#7c2331; --muted:#7d7061;
    --line: rgba(36,26,18,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Lora', serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .tag{font-family:'Space Mono',monospace;font-size:0.75rem;letter-spacing:0.2em;color:var(--pink);text-transform:uppercase;}
  h1{
    font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.02em; font-weight:400;
    font-size:clamp(4rem,18vw,9rem); color:var(--gold); margin:10px 0 6px; line-height:1;
    text-shadow:0 0 40px rgba(212,175,55,0.25);
  }
  p{color:var(--cream-dim); font-size:1.05rem; max-width:480px; margin:0 auto 30px;}
  a.home-link{
    display:inline-block; font-family:'Space Mono',monospace; font-size:0.85rem;
    color:var(--cream); border:1px solid var(--line); border-radius:999px;
    padding:12px 26px; text-decoration:none; transition:.2s;
  }
  a.home-link:hover{border-color:var(--gold); color:var(--gold);}
</style>
</head>
<body>
  <div>
    <div class="tag">Introuvable</div>
    <h1>404</h1>
    <p>Cette page a quitté le bâtiment — un peu comme Elvis. La page que tu cherches n'existe pas ou plus.</p>
    <a href="index.html" class="home-link">← Retour à l'accueil</a>
  </div>
</body>
</html>
